[package]
name = "asonb"
version = "4.1.1"
edition = "2024"

license-file = "LICENSE.additional"
description = "ASONB is the binary form of ASON, the typed data format for AI agents, tools, and people, optimized for efficient storage, access, and transmission."
repository = "https://github.com/hemashushu/asonb"
readme = "../../README.md"
keywords = ["ason", "asonb", "serde"]
categories = ["encoding", "parsing"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde_bytes = "0.11"
asonb-derive = { path = "../asonb-derive", version = "4.1.1" }

[dev-dependencies]
pretty_assertions = "1.4.1"
proptest = "1"
trybuild = "1"
