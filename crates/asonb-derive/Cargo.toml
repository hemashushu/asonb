[package]
name = "asonb-derive"
version = "3.1.2"
edition = "2024"

license-file = "LICENSE.additional"
description = "Schema derive macro for ASONB"
homepage = "https://github.com/hemashushu/asonb"
repository = "https://github.com/hemashushu/asonb"
documentation = "https://docs.rs/asonb-derive"
readme = "../../README.md"
keywords = ["ason", "asonb", "serde", "derive", "proc-macro"]
categories = ["encoding", "parsing", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "3.0.9", features = ["full"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"