name: Publish to crates.io

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test workspace
        run: cargo test --workspace --all-features --locked

      - name: Package workspace
        run: cargo package --workspace --locked

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          for crate in asonb-derive asonb; do
            version=$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["package"]["version"])' "crates/$crate/Cargo.toml")
            http_status=$(curl --silent --show-error --location --retry 3 \
              --user-agent "asonb-publish-workflow" \
              --output /dev/null --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/$crate/$version")

            case "$http_status" in
              200)
                echo "$crate $version is already published; skipping."
                ;;
              404)
                cargo publish --package "$crate" --locked
                ;;
              *)
                echo "Failed to check $crate $version on crates.io: HTTP $http_status" >&2
                exit 1
                ;;
            esac
          done